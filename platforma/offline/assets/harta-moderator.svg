<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1050" viewBox="0 0 1100 1050" role="img" aria-labelledby="title desc"><title id="title">Plicul dispărut / Montajul moderatorului</title><desc id="desc">Ușa în stânga, canapeaua în dreapta, trei echipe în aceeași sală. Schematizare fără cote.</desc><g font-family="Segoe UI,Arial,sans-serif" fill="#38284f"><rect width="1100" height="1050" fill="#faf8ff"/><text x="65" y="60" font-size="30" font-weight="800">PLICUL DISPĂRUT</text><text x="65" y="90" font-size="17">Montajul moderatorului / trei echipe, o singură sală</text><rect x="160" y="150" width="790" height="720" rx="20" fill="white" stroke="#90839e" stroke-width="3"/><path d="M950 290V690" stroke="#d2e5ec" stroke-width="10" stroke-dasharray="80 18"/><text x="967" y="480" font-size="14" transform="rotate(90 967 480)">Ferestre</text><rect x="745" y="190" width="150" height="80" rx="12" fill="#e8ddff"/><text x="806" y="235" font-size="21" font-weight="700">TV</text><rect x="450" y="190" width="235" height="50" rx="8" fill="#e9e5ef"/><text x="478" y="220" font-size="16">Bibliotecă / dulapuri</text><rect x="495" y="270" width="105" height="90" rx="8" fill="#ffe0da"/><text x="510" y="318" font-size="16">Flipchart</text><rect x="190" y="315" width="65" height="280" rx="9" fill="#e7e4ea"/><text x="181" y="297" font-size="14">Pervaz / rame</text><rect x="370" y="380" width="290" height="62" rx="6" fill="#e9e6ed" stroke="#a79eaf"/><rect x="370" y="442" width="64" height="190" rx="6" fill="#e9e6ed" stroke="#a79eaf"/><rect x="596" y="442" width="64" height="190" rx="6" fill="#e9e6ed" stroke="#a79eaf"/><text x="464" y="499" font-size="19" font-weight="700">Mese în U</text><text x="458" y="530" font-size="14">Dovezile comune</text><rect x="835" y="670" width="70" height="150" rx="17" fill="#ddd7e8" stroke="#a79eaf"/><rect x="695" y="750" width="175" height="70" rx="17" fill="#ddd7e8" stroke="#a79eaf"/><text x="716" y="795" font-size="16">Canapea în L</text><rect x="705" y="685" width="115" height="44" rx="9" fill="#f5efe5"/><text x="722" y="712" font-size="12">Măsuță joasă</text><path d="M160 720V810" stroke="white" stroke-width="12"/><path d="M160 720H95" fill="none" stroke="#90839e" stroke-width="3"/><path d="M95 720Q95 788 160 788" fill="none" stroke="#a99db6" stroke-width="2" stroke-dasharray="5 5"/><text x="78" y="836" font-size="18" font-weight="750">UȘA</text><rect x="195" y="677" width="35" height="35" rx="6" fill="#8daecb"/><text x="185" y="655" font-size="12">Scaun temporar</text><path d="M310 830V640" fill="none" stroke="#edf1e9" stroke-width="24" stroke-linecap="round"/><text x="272" y="628" font-size="11">Culoar liber</text><circle cx="397" cy="405" r="21" fill="#9a6ef5"/><text x="391" y="412" font-size="19" fill="white" font-weight="700">A</text><circle cx="759" cy="689" r="21" fill="#ff9a8e"/><text x="753" y="696" font-size="19" font-weight="700">B</text><circle cx="626" cy="596" r="21" fill="#c7e58e"/><text x="619" y="603" font-size="19" font-weight="700">C</text><rect x="240" y="730" width="145" height="65" rx="12" fill="#ffe0da" stroke="#bf8d86"/><text x="258" y="756">Masa Dan</text><text x="258" y="780" font-size="13">Moderator / plicuri</text><text x="65" y="921" font-size="16" font-weight="700">A · Mesaje și conturi</text><text x="385" y="921" font-size="16" font-weight="700">B · Fotografii și documente</text><text x="750" y="921" font-size="16" font-weight="700">C · Ore și trasee</text><text x="65" y="959" font-size="13">Reuniți informațiile pe mesele centrale. Probele se predau de moderator, pe runde.</text><text x="65" y="987" font-size="13">Nu părăsiți sala și nu căutați prin lucruri personale. Ușa rămâne liberă.</text><text x="65" y="1020" font-size="10" fill="#8e829e">MATERIAL DE JOC / CAZ FICTIV / plan orientativ fără cote, de verificat în sală</text></g></svg>